name: mampir_app
description: "MAMPIR - Makan, Ampir, Pilih, dan Rekomendasi Tempat Makan & Nongkrong di Purwokerto dan Sekitarnya (Baturraden, Sokaraja)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ============================================================
  # PACKAGE WAJIB UNTUK MAMPIR APP
  # ============================================================

  # Package HTTP untuk memanggil REST API (Web Service)
  # Digunakan di lib/services/api_service.dart untuk HTTP GET & POST
  http: ^1.4.0

  # Package Peta OpenStreetMap (GRATIS, tanpa API Key berbayar)
  # Digunakan di home_screen.dart tab Peta
  flutter_map: ^7.0.2

  # Package koordinat latitude/longitude untuk flutter_map
  latlong2: ^0.9.1

  # Package penyimpanan lokal (budget, selera, favorit)
  # Digunakan di lib/services/preference_service.dart
  shared_preferences: ^2.3.5

  # Package untuk format mata uang Rupiah & tanggal
  intl: ^0.19.0

  # Package untuk membuka Google Maps dari aplikasi
  # Digunakan di place_detail_screen.dart tombol "Buka Rute"
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
